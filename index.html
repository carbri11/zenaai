      if (!messages.length) {
        setHint(['무엇을 도와드릴까요?', '+ 버튼으로 파일·이미지 첨부와 웹 검색을 쓸 수 있어요.']);
        updateScrollButton();
        return;
      }
      // 답변이 써지는 중인 말풍선은 새로 만들지 않고 그대로 다시 붙여서, 화면이 끊기지 않게 해요
      messages.forEach((m) => chatBox.appendChild(live && m === live.msg ? live.bubble : buildBubble(m)));
      scrollChatToBottom(forceScroll);
    }

    function renderPending() {
      attachRow.innerHTML = '';
      pending.forEach((p, i) => {
        const el = document.createElement('div'); el.className = 'attach';
        if (p.kind === 'img') { const im = document.createElement('img'); im.src = p.thumb; el.appendChild(im); }
        const n = document.createElement('span'); n.textContent = p.name; el.appendChild(n);
        const x = document.createElement('button'); x.type = 'button'; x.textContent = '×';
        x.addEventListener('click', () => { pending.splice(i, 1); renderPending(); });
        el.appendChild(x); attachRow.appendChild(el);
      });
    }

    // ---- 첨부 ----
    async function shrinkImage(file, maxSide, quality) {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', quality);
    }

    async function attachFiles(fileList) {
      if (!canUseChat()) return;
      let added = false;
      for (const f of fileList) {
        try {
          if (f.type.startsWith('image/')) {
            if (pending.filter((p) => p.kind === 'img').length >= MAX_IMAGES) { addBubble(`이미지는 최대 ${MAX_IMAGES}장까지예요.`, 'err'); continue; }
            const imgName = f.name && f.name !== 'image.png' ? f.name : `pasted-image-${Date.now()}.png`;
            pending.push({ kind: 'img', name: imgName, full: await shrinkImage(f, 1024, 0.85), thumb: await shrinkImage(f, 160, 0.7) });
            added = true;
          } else if (TEXT_EXT.test(f.name)) {
            pending.push({ kind: 'file', name: f.name, text: await f.slice(0, FILE_READ_LIMIT).text() });
            added = true;
          } else {
            addBubble(`지원하지 않는 형식이에요: ${f.name}`, 'err');
          }
        } catch { addBubble(`첨부 실패: ${f.name}`, 'err'); }
      }
      if (added) renderPending();
    }

    function closePlusMenu() {
      plusMenu.hidden = true;
      plusBtn.setAttribute('aria-expanded', 'false');
    }
    plusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (plusBtn.disabled) return;
      const open = plusMenu.hidden;
      plusMenu.hidden = !open;
      plusBtn.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', (e) => { if (!plusMenu.hidden && !plusMenu.contains(e.target)) closePlusMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlusMenu(); });
    $('menu-upload').addEventListener('click', () => {
      closePlusMenu();
      if (!canUseChat()) return;
      fileInput.click();
    });
    fileInput.addEventListener('change', async () => {
      await attachFiles(fileInput.files);
      fileInput.value = '';
    });

    window.addEventListener('paste', async (e) => {
      if (!canUseChat()) return;
      const items = e.clipboardData?.items;
      if (!items?.length) return;
      const pastedImages = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) pastedImages.push(file);
        }
      }
      if (!pastedImages.length) return;
      if (document.activeElement === promptInput) {
        e.preventDefault();
      }
      await attachFiles(pastedImages);
    });

    // ---- AI 요청 ----
    // ---- 토큰 추정 (정확하지 않아도 되도록 보수적으로) ----
    function estTokens(text) {
      const str = String(text || '');
      let hangul = 0;
      for (const ch of str) {
        const c = ch.codePointAt(0);
        if ((c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E)) hangul++;
      }
      return Math.ceil(hangul * 1.2 + (str.length - hangul) * 0.4) + 6;
    }

    function msgTokens(m) {
      return estTokens((m.ai ?? m.text ?? '') + (m.ctxExtra || ''));
    }

    function systemMsg() {
      const extra = sessionSummary
        ? `\n\n[이전 대화 요약 - 오래된 대화는 이 요약으로 기억하세요]\n${sessionSummary}`
        : '';
      // system 메시지는 하나만 둬야 해서 요약도 같은 메시지에 합쳐요
      return { role: 'system', content: SYSTEM_MSG.content + extra };
    }

    // 요약에 이미 들어간 앞부분 메시지는 빼고 보내요
    function liveHistory(hist) {
      return hist.slice(Math.max(0, covered - baseOffset));
    }

    function imageTokens(list) {
      let idx = -1;
      list.forEach((m, i) => { if (m.images?.length) idx = i; });
      return idx >= 0 ? list[idx].images.length * IMG_TOKENS : 0;
    }

    function toApi(m, withImages = true) {
      if (m.role === 'assistant') return { role: 'assistant', content: m.text };
      const text = (m.ai ?? m.text ?? '') + (m.ctxExtra || '');   // ctxExtra: 이번 질문에만 붙는 검색 결과
      if (withImages && m.images?.length) {
        return { role: 'user', content: [{ type: 'text', text }, ...m.images.map((u) => ({ type: 'image_url', image_url: { url: u } }))] };
      }
      return { role: 'user', content: text };
    }

    function buildPayload(hist, dropOldestTurns = 0) {
      const sys = systemMsg();
      let live = liveHistory(hist);
      if (dropOldestTurns > 0) live = live.slice(dropOldestTurns * 2);
      let budget = inputBudget() - estTokens(sys.content) - imageTokens(live);
      const picked = [];
      for (let i = live.length - 1; i >= 0; i--) {
        const t = msgTokens(live[i]);
        if (picked.length && budget - t < 0) break;
        budget -= t;
        picked.unshift(live[i]);
      }
      while (picked.length && picked[0].role !== 'user') picked.shift();
      if (!picked.length && live.length) {
        const lastUser = [...live].reverse().find((m) => m.role === 'user');
        if (lastUser) picked.push(lastUser);
      }
      // 이미지는 가장 최근 이미지 메시지에만 다시 보내요 (컨텍스트/속도 절약)
      let lastImgIdx = -1;
      picked.forEach((m, i) => { if (m.images?.length) lastImgIdx = i; });
      return [sys, ...picked.map((m, i) => toApi(m, i === lastImgIdx))];
    }

    function estPayload(hist) {
      const live = liveHistory(hist);
      return estTokens(systemMsg().content) + live.reduce((a, m) => a + msgTokens(m), 0) + imageTokens(live);
    }

    // ---- 알림 ----
    let toastTimer = null;
    function showToast(text) {
      let el = document.getElementById('toast');
      if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ---- 서버의 실제 컨텍스트 길이 읽기 ----
    async function ensureCtx(url, key) {
      if (!url || ctxFor === url) return;
      let n = 0;
      try {
        const r = await fetch(`${url}/props`, { headers: key ? { Authorization: `Bearer ${key}` } : {} });
        if (r.ok) {
          const d = await r.json();
          n = Number(d?.default_generation_settings?.n_ctx || d?.n_ctx || 0);
        }
      } catch {}
      ctxTokens = n >= 1024 ? n : CTX_FALLBACK;   // 못 읽으면 가장 작은 값으로 안전하게
      ctxFor = url;
    }

    // ---- 대화 요약 (길어지면 앞부분을 요약해서 Cloudflare에 저장) ----
    async function compactMemory(stable) {
      const id = activeId;
      const url = server.url, key = server.api_key;
      if (!server.online || !url) return false;
      const start = Math.max(0, covered - baseOffset);
      const foldEnd = stable.length - KEEP_TAIL;
      if (foldEnd - start < 2) return false;           // 요약할 만큼 쌓이지 않음
      const chunk = stable.slice(start, foldEnd);

      let prompt = '';
      for (const cap of [1200, 600, 300]) {
        const transcript = chunk.map((m) => `${m.role === 'user' ? '사용자' : 'AI'}: ${(m.ai ?? m.text ?? '').slice(0, cap)}`).join('\n');
        prompt =
          '아래 [이전 요약]과 [새 대화]를 합쳐서, 앞으로의 대화에 꼭 필요한 내용만 한국어로 간결하게 요약해줘. ' +
          '사용자의 이름·목표·선호, 결정된 사항, 중요한 사실, 코드·숫자·고유명사, 아직 끝나지 않은 일은 빠뜨리지 마. ' +
          '글머리표로 600자 이내, 요약만 출력해.\n\n' +
          `[이전 요약]\n${sessionSummary || '(없음)'}\n\n[새 대화]\n${transcript}`;
        if (estTokens(prompt) <= inputBudget() - 100) break;
      }

      const headers = { 'Content-Type': 'application/json' };
      if (key) headers['Authorization'] = `Bearer ${key}`;
      const ctl3 = new AbortController();
      compactCtl = ctl3;
      const timer3 = setTimeout(() => ctl3.abort(), 120000);
      let summary = '';
      try {
        const res = await fetch(`${url}/v1/chat/completions`, {
          method: 'POST', headers, signal: ctl3.signal,
          body: JSON.stringify({ messages: [{ role: 'user', content: prompt }], stream: false, max_tokens: 400, temperature: 0.2 }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        summary = (data?.choices?.[0]?.message?.content || '').trim();
      } finally { clearTimeout(timer3); }
      if (!summary) return false;
      if (id !== activeId) return false;               // 요약하는 사이에 다른 채팅으로 바뀜

      const newCovered = baseOffset + foldEnd;
      summary = summary.slice(0, 1500);
      const title = chats.find((c) => c.id === id)?.title || '새 채팅';
      const saveRes = await fetch(`${WORKER_URL}/api/turn`, {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          session_id: id, title, user_text: '', assistant_text: '',
          summary, state_json: JSON.stringify({ covered: newCovered }),
        }),
      });
      if (!saveRes.ok) return false;                   // 저장에 실패하면 적용하지 않아요 (다음에 불러올 때 어긋나지 않게)
      if (id !== activeId) return true;
      sessionSummary = summary;
      covered = newCovered;
      return true;
    }

    // 답변이 끝난 뒤, 다음 질문에 쓸 자리가 부족해질 것 같으면 미리 요약해 둬요
    function maybeCompact() {
      if (compactJob || !server.online) return;
      if (estPayload(messages) < inputBudget() * SUMMARIZE_AT) return;
      clearTimeout(compactTimer);
      // 사용자가 답을 읽는 동안(15초) 아무 입력이 없을 때만 요약해요. 새 질문이 오면 요약은 취소돼요.
      compactTimer = setTimeout(() => {
        if (compactJob || busy || !server.online) return;
        if (estPayload(messages) < inputBudget() * SUMMARIZE_AT) return;
        compactJob = (async () => {
          try {
            if (await compactMemory(messages.slice())) showToast('🧠 대화가 길어져서 앞부분을 요약해 저장했어요. 이어서 말해도 기억해요.');
          } catch {} finally { compactJob = null; compactCtl = null; }
        })();
      }, COMPACT_DELAY_MS);
    }

    // 보내기 직전에 자리가 모자라면(긴 글 붙여넣기 등) 먼저 요약해요
    async function ensureRoom(turn) {
      if (estPayload(messages.slice(0, -1)) <= inputBudget()) return;
      turn.compacting = true;
      try {
        if (await compactMemory(messages.slice(0, -2))) showToast('🧠 대화가 길어져서 앞부분을 요약해 저장했어요.');
      } catch {} finally { turn.compacting = false; }
    }

    // ---- 웹 검색 ----
    // 자동 모드: 답변 전에 모델에게 "웹 검색을 할 거니? YES/NO"를 물어보고, YES일 때만 검색해요.
    const SEARCH_STRONG = /(뉴스|속보|날씨|기온|미세먼지|환율|주가|시세|비트코인|코인 가격|실시간|순위|랭킹|근황|논란|개봉|출시|발매|패치\s?노트|우승|경기 결과|선거|최신|최근|올해|작년|20[2-9]\d\s*년|latest|news|weather|stock price|score)/i;
    const SEARCH_WEAK = /(오늘|어제|내일|이번\s*(주|달|해|시즌)|요즘|지금|현재|방금)/;
    const SEARCH_MAYBE = /(누구|언제|어디|얼마|몇\s*(명|살|개|위|번)|무슨|어떤|뭐야|뭔데|뭐지|알려\s*줘|알려줄래|정보|리뷰|후기|평가|추천|비교|차이|멤버|가격|맛집|영업시간|운영시간|전화번호|주소|나이|who|what is|where|when|how much)/i;
    const SEARCH_NO = /(```|번역|translate|코드|함수|스크립트|버그|에러|오류|컴파일|정규식|\bSQL\b|python|javascript|\bhtml\b|\bcss\b|계산|방정식|증명|소설|시를|시 써|가사|이야기 써|롤플레이|역할극|요약해|고쳐|교정|맞춤법|다듬어)/i;

    function historyTokens() {
      let n = estTokens(sessionSummary || '');
      for (const m of messages) n += estTokens(m.text || '');
      return n;
    }

    async function decideSearch(text, url, key) {
      const t = String(text || '').trim();
      if (t.length < 2 || t.includes('```')) return false;
      // 규칙으로 정하지 않고, 답변하기 전에 항상 모델에게 "검색할 거니? YES/NO" 로 물어봐요.
      // 모델이 대답하지 못하면(오류·시간 초과) 확실한 최신 정보 질문만 검색해요.
      const fallback = SEARCH_STRONG.test(t) && !SEARCH_NO.test(t);
      if (!url) return fallback;
      const prevUser = [...messages].reverse().find((m) => m.role === 'user' && m.text && m.text !== t);
      const ctxLine = (t.length < 20 && prevUser) ? `(직전 질문: ${prevUser.text.slice(0, 80)})\n` : '';
      const c = new AbortController();
      const timer = setTimeout(() => c.abort(), 12000);
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (key) headers['Authorization'] = `Bearer ${key}`;
        const res = await fetch(`${url}/v1/chat/completions`, {
          method: 'POST', headers, signal: c.signal,
          body: JSON.stringify({
            messages: [
              { role: 'system', content: '당신은 질문에 답하기 전에 웹 검색을 할지 정합니다. 특정 인물·그룹·회사·제품·작품·장소·사건에 대한 사실, 최신 소식, 실시간 정보, 가격·일정·순위처럼 틀리면 안 되는 정보를 묻거나, 당신이 확실히 알지 못할 수 있으면 YES. 인사·잡담, 코딩, 번역, 글쓰기·창작, 계산, 누구나 아는 일반 상식, 사용자 본인의 이야기면 NO. 애매하면 YES. 반드시 YES 또는 NO 한 단어로만 답하세요.' },
              { role: 'user', content: `${ctxLine}질문: ${t.slice(0, 300)}\n\n웹 검색을 할 거니? YES 또는 NO로 말해.` },
            ],
            stream: false, max_tokens: 4, temperature: 0,
            chat_template_kwargs: { enable_thinking: false },
          }),
        });
        if (!res.ok) return fallback;
        const d = await res.json();
        const ans = d?.choices?.[0]?.message?.content || '';
        if (/\byes\b|예|네|응/i.test(ans.slice(0, 6))) return true;
        if (/\bno\b|아니/i.test(ans.slice(0, 6))) return false;
        return fallback;
      } catch { return fallback; } finally { clearTimeout(timer); }
    }

    async function runSearch(query) {
      const res = await fetch(`${WORKER_URL}/api/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
        body: JSON.stringify({ query }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `검색 오류 (${res.status})`);
      return { results: d.results || [], remaining: d.remaining };
    }

    function buildSearchBlock(results) {
      const today = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
      const head = `\n\n[웹 검색 결과 · ${today} 기준]\n`;
      const tail = '\n\n위 검색 결과를 참고해서 자연스럽게 답하세요. 결과에 없는 내용은 추측하지 말고 모른다고 하세요. 답변 본문에는 출처 번호나 링크를 절대 쓰지 마세요.';
      let room = Math.floor(inputBudget() * 0.35) - estTokens(head + tail);   // 검색 결과가 차지할 수 있는 자리
      const used = [], lines = [];
      for (const r of results.slice(0, 3)) {   // 길면 느려져서 3개까지만 써요
        const line = `• ${r.title}\n  ${String(r.snippet).slice(0, 320)}`;
        const t = estTokens(line);
        if (used.length && room - t < 0) break;
        room -= t; used.push(r); lines.push(line);
      }
      return { text: head + lines.join('\n\n') + tail, used };
    }

    function isContextOverflowError(err) {
      return Boolean(err?.isContextOverflow) || /exceed|context|too long|max.*tokens/i.test(err?.message || '');
    }

    function isNetworkError(err) {
      return Boolean(err?.transient) || err?.name === 'TypeError' || /network|failed to fetch|load failed|연결/i.test(err?.message || '');
    }

    function setBusy(v) {
      busy = v;
      sendBtn.textContent = v ? '중지' : '전송';
      sendBtn.className = v ? 'btn-stop' : 'btn-primary';
      const usable = canUseChat();
      promptInput.disabled = v || !usable;
      plusBtn.disabled = v || !usable;
      if (plusBtn.disabled) closePlusMenu();
    }

    /**
     * 서버에 한 번 요청해서 글자를 받아 aiMsg.text에 이어 붙여요.
     * 반환: 'done'(정상 종료) | 'cut'(길이 제한으로 끊김) | 'dropped'(종료 신호 없이 끊김)
     */
    async function streamSegment(url, headers, payloadMsgs, aiMsg, turn) {
      ctl = new AbortController();
      const res = await fetch(`${url}/v1/chat/completions`, {
        method: 'POST',
        headers,
        signal: ctl.signal,
        body: JSON.stringify({ messages: payloadMsgs, stream: true, max_tokens: MAX_OUT }),
      });
      if (!res.ok) {
        let body = '';
        try { body = (await res.text()).slice(0, 200); } catch {}
        const isOverflow = /exceed|context|too long|max.*tokens/i.test(body);
        const reqErr = new Error(
          isOverflow ? '대화가 너무 길어요. 새 채팅을 시작해 주세요.' : `서버 응답 오류 (${res.status}) ${body}`
        );
        reqErr.isContextOverflow = isOverflow;
        if ([502, 503, 504, 524].includes(res.status)) {
          reqErr.transient = true;
          reqErr.message = `서버 연결이 불안정해요 (${res.status}). 잠시 후 다시 시도해 주세요.`;
        }
        throw reqErr;
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '', segTokens = 0, sawEnd = false, cut = false;
      lastData = Date.now();

      // 글자가 오다가 한참 아무것도 안 오면(연결이 조용히 끊김) 요청을 끊고 이어쓰기로 넘어가요
      const watchdog = setInterval(() => {
        if (segTokens > 0 && Date.now() - lastData > STALL_MS) ctl?.abort();
      }, 5000);

      const handleLine = (line) => {
        const t = line.trim();
        if (!t.startsWith('data:')) return;
        const d = t.slice(5).trim();
        if (!d) return;
        if (d === '[DONE]') { sawEnd = true; return; }
        let j;
        try { j = JSON.parse(d); } catch { return; }
        const ch = j.choices?.[0];
        if (ch?.delta?.reasoning_content && !turn.gotToken) turn.thinking = true;
        if (ch?.delta?.content) {
          segTokens++;
          if (!turn.gotToken) {
            turn.gotToken = true;
            live?.bubble.classList.remove('wait');
          }
          aiMsg.text += ch.delta.content;
          queueFlush();
        }
        if (ch?.finish_reason) {
          sawEnd = true;
          if (ch.finish_reason === 'length') cut = true;
        }
      };

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          lastData = Date.now();
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) handleLine(line);
        }
        if (buf.trim()) handleLine(buf);
      } finally {
        clearInterval(watchdog);
      }

      if (cut) return 'cut';
      if (!sawEnd) {
        if (!aiMsg.text.trim()) throw new TypeError('연결이 끊겼어요');
        return 'dropped';
      }
      return 'done';
    }

    function finishLiveBubble(aiMsg) {
      if (!live) return;
      live.bubble.classList.remove('wait');
      renderRich(live.txt, aiMsg.text);
      scrollChatToBottom(false);
    }

    promptForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) {
        userAborted = true;
        ctl?.abort();
        return;
      }
      if (!canUseChat()) {
        addBubble('로그인 후 메시지를 보낼 수 있어요.', 'err');
        return;
      }

      let text = promptInput.value.trim();
      if (!text && !pending.length) return;
      if (!text) text = '첨부한 내용을 봐줘.';

      await pollServer();
      if (!server.online || !server.url) {
        addBubble(
          vmBooting() ? '서버가 켜지는 중이에요. 위 상태가 "AI 서버 온라인"으로 바뀌면 다시 보내 주세요. (약 5분)'
          : vm.canStart ? '서버가 꺼져 있어요. 위의 "서버 켜기" 버튼을 눌러 주세요.'
          : '서버가 꺼져 있어요. 서버를 켤 수 있는 사용자에게 요청해 주세요.',
          'err');
        return;
      }
      clearTimeout(compactTimer);            // 대기 중인 요약은 취소해요 (새 질문이 먼저)
      if (compactJob) {                      // 요약 중이었다면 멈추고 바로 답변해요
        compactCtl?.abort();
        try { await compactJob; } catch {}
      }
      // 이번 답변 동안은 주소를 고정해서, 중간에 폴링이 바꿔도 영향이 없게 해요
      const turnUrl = server.url, turnKey = server.api_key;

      const files = pending.filter((p) => p.kind === 'file');
      const imgs = pending.filter((p) => p.kind === 'img');
      let ai = text, fileBudget = totalFileChars();
      for (const f of files) {
        const t = f.text.slice(0, Math.max(0, Math.min(fileChars(), fileBudget)));
        fileBudget -= t.length;
        ai += `\n\n[첨부 파일: ${f.name}]\n${t}${f.text.length > t.length ? '\n...(이하 생략)' : ''}`;
      }
      if (imgs.length) ai += `\n\n(이미지 ${imgs.length}장 첨부)`;

      const userMsg = {
        role: 'user',
        text,
        ai,
        files: files.map((f) => f.name),
        thumbs: imgs.map((i) => i.thumb),
        images: imgs.map((i) => i.full),
      };
      const aiMsg = { role: 'assistant', text: '' };
      const backupText = promptInput.value;
      const backupPending = [...pending];

      userAborted = false;
      followBottom = true;
      messages.push(userMsg);
      promptInput.value = '';
      pending = [];
      renderPending();
      renderChat(true);

      const bubble = buildBubble(aiMsg);
      bubble.classList.add('wait');
      live = { msg: aiMsg, bubble, txt: bubble.querySelector('.txt') };
      chatBox.appendChild(bubble);
      messages.push(aiMsg);
      scrollChatToBottom(true);

      const startT = Date.now();
      const turn = { gotToken: false, thinking: false };
      let titleJob = null;
      live.txt.textContent = '응답 대기 중 · 0초';

      const timer = setInterval(() => {
        try {
          if (turn.gotToken || !live) return;
          const s = Math.floor((Date.now() - startT) / 1000);
          live.txt.textContent = (turn.searching ? '🌐 웹 검색 중' : turn.judging ? '🔎 검색이 필요한지 확인 중' : turn.compacting ? '🧠 대화 요약 정리 중' : turn.thinking ? '모델이 추론 중' : '응답 대기 중') + ` · ${s}초`
            + (s >= 20 ? '\n모델 첫 응답 준비 중이에요. 잠시만 기다려 주세요.' : '');
        } catch {}
      }, 500);

      setBusy(true);
      try {
        let searchSources = [];
        await ensureCtx(turnUrl, turnKey);               // 서버의 실제 컨텍스트 길이에 맞춰요
        let doSearch = searchMode === 'on';
        if (searchMode === 'auto' && !files.length && !imgs.length) {
          turn.judging = true;
          try { doSearch = await decideSearch(text, turnUrl, turnKey); } catch { doSearch = false; }
          turn.judging = false;
          if (userAborted) throw new Error('중지');
        }
        if (doSearch) {
          turn.searching = true;
          try {
            // 짧은 후속 질문("그 사람 나이는?")은 직전 질문을 붙여서 검색해요
            let q = text;
            const prevUser = [...messages].reverse().find((m) => m.role === 'user' && m !== userMsg);
            if (q.length < 20 && prevUser?.text) q = prevUser.text.slice(0, 80) + ' ' + q;
            const { results, remaining } = await runSearch(q.slice(0, 200));
            if (results.length) {
              const blk = buildSearchBlock(results);
              userMsg.ctxExtra = blk.text;               // 이번 질문에만 붙이고, 저장하는 기록에는 넣지 않아요
              searchSources = blk.used;
              if (typeof remaining === 'number' && remaining <= 2) showToast(`오늘 남은 검색 횟수: ${remaining}회`);
            } else {
              showToast('검색 결과가 없어서 검색 없이 답해요.');
            }
          } catch (e) {
            showToast(`웹 검색 실패: ${e.message} · 검색 없이 답해요.`);
          }
          turn.searching = false;
          if (userAborted) throw new Error('중지');
        }
        await ensureRoom(turn);                          // 자리가 모자라면 앞부분을 요약해서 저장
        if (userAborted) throw new Error('중지');
        const headers = { 'Content-Type': 'application/json' };
        if (turnKey) headers['Authorization'] = `Bearer ${turnKey}`;
        const historyBeforeTurn = messages.slice(0, -1);
        const maxDropTurns = Math.max(1, Math.ceil(historyBeforeTurn.length / 2));

        let continueCount = 0, netRetries = 0;

        while (!userAborted) {
          let result = 'done';

          for (let dropTurns = 0; dropTurns <= maxDropTurns; dropTurns++) {
            if (userAborted) break;
            const currentHist = aiMsg.text.trim()
              ? [...historyBeforeTurn, { role: 'assistant', text: aiMsg.text }, { role: 'user', text: CONTINUE_PROMPT }]
              : historyBeforeTurn;
            const payloadMsgs = buildPayload(currentHist, dropTurns);
            if (dropTurns > 0 && payloadMsgs.length <= 1) {
              const overflowErr = new Error('대화가 너무 길어요. 새 채팅을 시작해 주세요.');
              overflowErr.isContextOverflow = true;
              throw overflowErr;
            }
            try {
              result = await streamSegment(turnUrl, headers, payloadMsgs, aiMsg, turn);
              break;
            } catch (attemptErr) {
              if (userAborted) break;
              if (!aiMsg.text.trim() && isContextOverflowError(attemptErr) && dropTurns < maxDropTurns) {
                continue;                                   // 대화가 길면 오래된 것부터 줄여서 다시
              }
              if (aiMsg.text.trim()) {
                result = 'dropped';                         // 글자를 받다가 끊김 → 이어쓰기
                break;
              }
              if (isNetworkError(attemptErr) && netRetries < MAX_NET_RETRIES) {
                netRetries += 1;                            // 아직 글자가 없을 때만 다시 시도
                await sleep(1500);
                dropTurns -= 1;
                continue;
              }
              throw attemptErr;
            }
          }

          if (!userAborted && aiMsg.text.trim() && (result === 'cut' || result === 'dropped') && continueCount < MAX_AUTO_CONTINUES) {
            continueCount += 1;
            continue;
          }
          break;
        }

        if (userAborted && !aiMsg.text.trim()) throw new Error('중지');   // 글자가 없으면 취소 처리

        if (!aiMsg.text.trim()) aiMsg.text = '(응답 없음)';
        finishLiveBubble(aiMsg);
        if (searchSources.length) { aiMsg.sources = searchSources; renderSources(bubble, searchSources); }
        const saved = await saveChat(ai, aiMsg.text, aiMsg.sources);
        if (saved && needTitle.has(activeId) && aiMsg.text !== '(응답 없음)') {
          needTitle.delete(activeId);
          titleJob = { id: activeId, q: userMsg.text, a: aiMsg.text };
        }
        if (saved) maybeCompact();
      } catch (err) {
        if (userAborted && aiMsg.text.trim()) {
          finishLiveBubble(aiMsg);
          await saveChat(ai, aiMsg.text, aiMsg.sources);
        } else {
          live = null;
          messages.splice(-2, 2);
          promptInput.value = backupText;
          pending = backupPending;
          renderPending();
          renderChat(false);
          if (!userAborted) {
            addBubble(`연결 오류: ${err.message} (현재 URL: ${turnUrl || '없음'})`, 'err');
          }
        }
      } finally {
        delete userMsg.ctxExtra;
        clearInterval(timer);
        live = null;
        flushQueued = false;
        ctl = null;
        userAborted = false;
        setBusy(false);
        if (canUseChat()) promptInput.focus();
        updateScrollButton();
      }
      if (titleJob) generateTitle(titleJob.id, titleJob.q, titleJob.a, turnUrl, turnKey);
    });

    // ---- 로그인 ----
    $('open-login-btn').addEventListener('click', () => { location.href = LOGIN_PAGE; });
    $('open-signup-btn').addEventListener('click', () => { location.href = SIGNUP_PAGE; });
    $('btn-new-chat').addEventListener('click', newChat);
    const SEARCH_LABELS = { auto: '자동', on: '✓ 항상 켜짐' };
    function applySearchMode() {
      const item = $('menu-search'), chip = $('search-chip');
      item.dataset.mode = searchMode;
      $('search-mode-label').textContent = SEARCH_LABELS[searchMode];
      chip.hidden = searchMode === 'auto';
      chip.dataset.mode = searchMode;
      chip.textContent = searchMode === 'on' ? '🌐 검색 항상 켜짐' : '🌐 검색 꺼짐';
      chip.title = '누르면 자동 모드로 돌아가요';
    }
    function setSearchMode(m) {
      searchMode = m;
      try { localStorage.setItem('zena_search_mode', m); } catch {}
      applySearchMode();
    }
    applySearchMode();
    $('menu-search').addEventListener('click', () => {
      closePlusMenu();
      setSearchMode(searchMode === 'on' ? 'auto' : 'on');
      showToast(searchMode === 'auto' ? '🌐 웹 검색: 자동 — 필요하다고 판단될 때만 검색해요.'
        : '🌐 웹 검색: 항상 켜짐 — 모든 질문에서 검색해요.');
    });
    $('search-chip').addEventListener('click', () => { setSearchMode('auto'); showToast('🌐 웹 검색: 자동'); });
    stopBtn.addEventListener('click', async () => {
      if (!accessToken) return;
      if (!confirm('서버를 끌까요?\n대화 중인 사용자가 있으면 답변이 끊겨요. 다시 켜려면 약 5분 걸려요.')) return;
      stopBtn.disabled = true;
      try {
        if (busy) { userAborted = true; ctl?.abort(); }   // 내 답변이 진행 중이면 먼저 멈춰요
        const res = await fetch(`${WORKER_URL}/api/vm/stop`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) {
          addBubble(d.error || `서버를 끄지 못했어요 (${res.status})`, 'err');
        } else {
          server = { ...server, online: false };
          vm.status = 'STOPPING'; vm.startedAt = 0;
          stopUntil = Date.now() + 180000;
          showToast('서버를 끄고 있어요. 완전히 꺼지기까지 1분쯤 걸려요.');
          setTimeout(() => { if (!document.hidden) pollServer(); }, 6000);
        }
      } catch (err) {
        addBubble('서버를 끄지 못했어요: ' + err.message, 'err');
      }
      refreshStatusLabel();
    });
    startBtn.addEventListener('click', async () => {
      if (!accessToken) return;
      startBtn.disabled = true;
      try {
        const res = await fetch(`${WORKER_URL}/api/vm/start`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) {
          addBubble(d.error || `서버를 켜지 못했어요 (${res.status})`, 'err');
        } else {
          vm.status = d.status || 'PROVISIONING';
          vm.startedAt = Date.now();
          stopUntil = 0;
          addBubble('서버를 켜고 있어요. 모델을 올리는 데 약 5분 걸려요. 위 상태가 "AI 서버 온라인"으로 바뀌면 대화할 수 있어요.', 'ai');
        }
      } catch (err) {
        addBubble('서버를 켜지 못했어요: ' + err.message, 'err');
      }
      refreshStatusLabel();
    });
    $('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut({ scope: 'local' });   // 이 기기만 로그아웃 (다른 기기는 유지)
    });

    // 가입(로그인)한 사용자는 모두 사용할 수 있어요. 허용 목록 검사는 하지 않아요.
    async function checkAllowed(currentUser) {
      return !!currentUser?.id;
    }

    async function applySession(session) {
      const nextUser = session?.user || null;
      accessToken = session?.access_token || '';
      

      // 같은 사용자의 토큰 갱신/탭 복귀 이벤트는 무시해요 (대화창을 다시 그리면 답변이 끊겨 보여요)
      if (sessionInit && (user?.id ?? null) === (nextUser?.id ?? null)) {
        user = nextUser;
        return;
      }
      sessionInit = true;

      if (busy) { userAborted = true; ctl?.abort(); }   // 다른 계정으로 바뀌면 진행 중인 답변은 멈춰요
      const seq = ++sessionSeq;
      user = nextUser;
      allowed = false;
      const ok = user ? await checkAllowed(user) : false;
      if (seq !== sessionSeq) return;                   // 그 사이 더 새로운 로그인 변경이 있었음
      allowed = ok === true;
      accessCheckFailed = ok === null;

      activeId = crypto.randomUUID();
      messages = [];
      pending = [];
      needTitle.add(activeId);
      server = { url: '', api_key: '', online: false };
      vm = { status: 'UNKNOWN', canStart: false, startedAt: 0, known: false };
      sessionSummary = ''; covered = 0; baseOffset = 0;

      renderPending();
      updateUi();
      renderChat(true);

      if (canUseChat()) {
        await loadChats();
        await pollServer();
      } else {
        chats = [];
        renderHistory();
      }
    }

    // '자동 로그인' 끄기를 고른 사용자는 브라우저를 껐다 켜면 로그아웃 (로그인 화면에서 표시해 둔 탭만 예외)
    try {
      if (localStorage.getItem(AUTO_LOGIN_KEY) === '0' && sessionStorage.getItem(SESSION_ALIVE_KEY) !== '1') {
        await supabase.auth.signOut({ scope: 'local' });
      }
    } catch {}

    // 구글 로그인 뒤 주소 끝에 남는 '#'(또는 토큰이 담긴 #access_token=...)을 지워요
    function cleanUrlHash() {
      try {
        const h = location.hash;
        // 주소 끝이 빈 '#'이면 location.hash는 ''로 나오므로 href로 확인해요
        if (location.href.endsWith('#') || /access_token=|refresh_token=|provider_token=/.test(h)) {
          history.replaceState(null, '', location.pathname + location.search);
        }
      } catch {}
    }

    // 로그인 처리가 끝난 뒤에 '#'가 늦게 붙는 경우가 있어서, 몇 번 더 확인해서 지워요
    // 15초 동안 0.1초마다 감시하고, 주소가 바뀌거나 페이지가 다시 보일 때도 지워요
    {
      const hashTimer = setInterval(cleanUrlHash, 100);
      setTimeout(() => clearInterval(hashTimer), 15000);
      window.addEventListener('hashchange', cleanUrlHash);
      window.addEventListener('pageshow', cleanUrlHash);
      window.addEventListener('load', cleanUrlHash);
    }

    const { data: { session } } = await supabase.auth.getSession();
    cleanUrlHash();

    // 로그인/회원가입 페이지를 거쳐 돌아왔으면 한 번 새로고침해요 (로그인 정보는 위에서 이미 저장됨)
    function reloadIfFromAuth() {
      try {
        if (sessionStorage.getItem(FROM_AUTH_KEY) === '1') {
          sessionStorage.removeItem(FROM_AUTH_KEY);
          location.replace(location.pathname + location.search);
          return true;
        }
      } catch {}
      return false;
    }
    // 뒤로가기로 캐시된 화면이 복원될 때도 같은 처리
    window.addEventListener('pageshow', (e) => { if (e.persisted) reloadIfFromAuth(); });
    if (reloadIfFromAuth()) await new Promise(() => {});   // 새로고침되는 동안 아래 코드는 실행하지 않아요
    await applySession(session);

    // 콜백 안에서 바로 supabase를 부르면 멈출 수 있어서 setTimeout으로 넘겨요
    supabase.auth.onAuthStateChange((_event, nextSession) => {
      setTimeout(() => { cleanUrlHash(); applySession(nextSession); }, 0);
    });
  </script>
</body>
</html>
