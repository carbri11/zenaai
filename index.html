<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>ZENA AI</title>
  <style>
    * {
      box-sizing: border-box;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    body, button, header, aside, .logo, .history-item, .attach {
      user-select: none;
      -webkit-user-select: none;
    }
    .msg, .msg * {
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
    }
    .msg img {
      user-select: none !important;
      -webkit-user-select: none !important;
      cursor: zoom-in;
    }
    .prompt-bar input[type=text] {
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
    }
    ::selection {
      background: rgba(96, 165, 250, 0.35);
      color: #ffffff;
    }
    html, body {
      height: 100dvh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
    }
    header {
      flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid #1f2430; background: #131620;
    }
    .header-left, .nav-actions { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 20px; font-weight: 700; color: #f3f4f6; user-select: none; cursor: default; }
    .logo span { color: #60a5fa; }
    .server-status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #1f2430; color: #9ca3af; }
    .server-status.online { background: rgba(34,197,94,.15); color: #4ade80; }
    .server-status.offline { background: rgba(248,113,113,.15); color: #f87171; }
    .server-status.booting { background: rgba(251,191,36,.15); color: #fbbf24; }
    .btn-start { background: #f59e0b; color: #111827; padding: 5px 12px; font-size: 12px; }
    .btn-start:hover:not(:disabled) { background: #d97706; }
    .btn-attach.on { background: #1d4ed8; color: #fff; box-shadow: inset 0 0 0 1px #60a5fa; }
    .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12px; white-space: normal; }
    .sources-title { color: #9ca3af; margin-bottom: 4px; }
    .msg .sources a { display: block; color: #93c5fd; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer !important; }
    .msg .sources a:hover { text-decoration: underline; }
    .toast { position: fixed; left: calc(50% + 130px); bottom: 96px; transform: translateX(-50%); z-index: 10000; max-width: 90vw;
      background: #232b3d; color: #f3f4f6; border: 1px solid #3a4661; border-radius: 10px; padding: 8px 14px; font-size: 13px;
      box-shadow: 0 6px 18px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
    .btn-stop-server { background: transparent; color: #f87171; border: 1px solid #7f1d1d; padding: 5px 12px; font-size: 12px; }
    .btn-log { background: transparent; color: #93c5fd; border: 1px solid #2f4a7a; padding: 5px 12px; font-size: 12px; }
    .btn-log:hover:not(:disabled) { background: rgba(96,165,250,.15); }
    .log-modal { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .log-modal[hidden] { display: none; }
    .log-panel { width: min(900px, 100%); max-height: 85dvh; display: flex; flex-direction: column; background: #0b0e14; border: 1px solid #2a3142; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
    .log-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #1f2430; }
    .log-head strong { font-size: 14px; }
    .log-head .log-state { font-size: 12px; color: #9ca3af; margin-left: auto; }
    .log-body { margin: 0; padding: 12px 16px; overflow: auto; flex: 1; min-height: 240px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #cbd5e1; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }
    .btn-stop-server:hover:not(:disabled) { background: rgba(248,113,113,.15); }

    /* 헤더: 로고와 서버 상태/버튼(왼쪽) · 계정(오른쪽) */
    header { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    header .nav-actions { justify-self: end; }
    .header-center { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 760px) {
      header { grid-template-columns: 1fr auto; row-gap: 8px; }
    }
    /* 입력창 왼쪽 + 버튼과 팝업 메뉴 */
    .plus-wrap { position: relative; flex-shrink: 0; }
    .btn-plus { width: 38px; height: 38px; padding: 0; border-radius: 50%; background: #1d2433; color: #e5e7eb;
      font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: transform .15s, background .15s; }
    .btn-plus:hover:not(:disabled) { background: #263049; }
    .btn-plus[aria-expanded="true"] { transform: rotate(45deg); background: #263049; }
    .plus-menu { position: absolute; left: 0; bottom: calc(100% + 14px); z-index: 50; min-width: 240px; padding: 8px;
      background: #1b2130; border: 1px solid #2f3850; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.55);
      display: flex; flex-direction: column; }
    .plus-menu[hidden] { display: none; }
    .menu-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent;
      color: #e5e7eb; padding: 11px 12px; border-radius: 10px; font-size: 14px; }
    .menu-item:hover:not(:disabled) { background: #263049; }
    .menu-item .mi { width: 20px; text-align: center; }
    .menu-item .mi-state { margin-left: auto; font-size: 12px; color: #93c5fd; background: rgba(96,165,250,.12); padding: 2px 8px; border-radius: 999px; }
    .menu-item[data-mode="off"] .mi-state { color: #9ca3af; background: rgba(156,163,175,.12); }
    .menu-sep { height: 1px; background: #2a3142; margin: 6px 4px; }
    .search-chip { flex-shrink: 0; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
      background: rgba(96,165,250,.15); color: #93c5fd; border: 1px solid rgba(96,165,250,.4); }
    .search-chip[hidden] { display: none; }
    .search-chip[data-mode="off"] { background: rgba(156,163,175,.12); color: #9ca3af; border-color: #3a4152; }
    .codeblock { margin: 10px 0; border: 1px solid #2f3748; border-radius: 10px; background: #0d1117; overflow: hidden; white-space: normal; }
    .codeblock-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #161b22; font-size: 12px; color: #9ca3af; }
    .msg .codeblock-head { user-select: none !important; -webkit-user-select: none !important; cursor: default; }
    .codeblock pre { margin: 0; padding: 12px; overflow-x: auto; white-space: pre; word-break: normal;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 1.55; color: #e6edf3; tab-size: 2; }
    .codeblock pre code { font-family: inherit; }
    .copy-btn { background: transparent; color: #9ca3af; border: 1px solid #374151; padding: 2px 10px; font-size: 12px; font-weight: 500; border-radius: 6px; }
    .copy-btn:hover { background: #1f2937; color: #f3f4f6; }
    .msg .copy-btn { cursor: pointer !important; }
    .inline-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 5px; }
    .user-badge { font-size: 13px; color: #9ca3af; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #e5e7eb; border: 1px solid #374151; }
    .btn-outline:hover:not(:disabled) { background: #1f2937; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-stop { background: #dc2626; color: #fff; }

    .workspace { flex: 1; display: flex; min-height: 0; overflow: hidden; }
    aside {
      width: 260px; flex-shrink: 0; background: #131620; border-right: 1px solid #1f2430;
      padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
    }
    .btn-new-chat { width: 100%; background: #1d2433; color: #f9fafb; border: 1px solid #2e374d; flex-shrink: 0; }
    .history-title { font-size: 12px; font-weight: 700; color: #9ca3af; padding: 0 6px; flex-shrink: 0; }
    .history-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-empty { font-size: 13px; color: #6b7280; padding: 10px 8px; line-height: 1.5; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; flex-shrink: 0;
      padding: 9px 10px; border-radius: 8px; color: #d1d5db; border: 1px solid transparent; font-size: 13px;
    }
    .history-item:hover { background: #1a1f2d; }
    .history-item.active { background: #1e2738; border-color: #3b82f6; color: #fff; }
    .history-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-del-chat { background: transparent; color: #9ca3af; padding: 2px 6px; font-size: 14px; }
    .btn-del-chat:hover { background: rgba(248,113,113,.18); color: #f87171; }

    main {
      position: relative;
      flex: 1; min-width: 0; max-width: 900px; width: 100%; margin: 0 auto; padding: 16px 20px;
      display: flex; flex-direction: column; min-height: 0; gap: 12px; overflow: hidden;
    }
    .chat-box {
      position: relative;
      flex: 1; min-height: 0; background: #161a24; border: 1px solid #232938; border-radius: 14px;
      padding: 18px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 14px;
    }
    .scroll-bottom-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      z-index: 20;
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      background: #232b3d;
      color: #f3f4f6;
      border: 1px solid #3a4661;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }
    .scroll-bottom-btn.visible {
      display: flex;
    }
    .scroll-bottom-btn:hover {
      background: #2d374e;
      border-color: #60a5fa;
    }

    .login-gate {
      margin: auto; max-width: 420px; width: 100%;
      background: #131722; border: 1px solid #2a3246; border-radius: 14px;
      padding: 28px 24px; text-align: center; display: flex; flex-direction: column; gap: 12px;
    }
    .login-gate h2 { margin: 0; font-size: 18px; color: #f9fafb; }
    .login-gate p { margin: 0; font-size: 14px; color: #9ca3af; line-height: 1.6; }
    .login-gate-actions { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }

    .hint { margin: auto; color: #6b7280; text-align: center; font-size: 14px; line-height: 1.6; }
    .hint b { color: #9ca3af; }
    .msg {
      padding: 12px 16px; border-radius: 12px; max-width: 82%; line-height: 1.55; flex-shrink: 0;
      font-size: 15px; white-space: pre-wrap; word-break: break-word;
    }
    .msg .chip, .msg .note {
      display: inline;
    }
    .msg .txt { display: block; }
    .prompt-bar input[type=text] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding: 6px 8px; min-width: 0; user-select: text; -webkit-user-select: text; }
    .prompt-bar.locked { opacity: .55; pointer-events: none; }
    .msg.ai { background: #1f2533; color: #e5e7eb; align-self: flex-start; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg.err { background: rgba(248,113,113,.15); color: #fca5a5; align-self: flex-start; }
    .msg.wait .txt { color: #9ca3af; }
    .msg .chip { display: inline-block; font-size: 12px; background: rgba(255,255,255,.18); border-radius: 6px; padding: 2px 8px; margin: 6px 6px 0 0; }
    .msg img {
      display: block; max-width: 240px; max-height: 240px; object-fit: contain;
      border-radius: 8px; margin-top: 8px; cursor: zoom-in;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .msg img:hover {
      transform: scale(1.02);
      border-color: #60a5fa;
    }
    .img-lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(5, 7, 12, 0.88);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .img-lightbox.open { display: flex; }
    .img-lightbox-inner {
      position: relative; max-width: 92vw; max-height: 90vh;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .img-lightbox img {
      max-width: 92vw; max-height: 82vh;
      border-radius: 10px; object-fit: contain;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
    }
    .img-lightbox-meta {
      color: #d1d5db; font-size: 13px; text-align: center;
    }
    .img-lightbox-close {
      position: fixed; top: 18px; right: 22px;
      background: rgba(29, 36, 51, 0.92); color: #f9fafb;
      border: 1px solid #374151; border-radius: 999px;
      width: 38px; height: 38px; padding: 0;
      font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .img-lightbox-close:hover { background: #dc2626; border-color: #ef4444; }
    .msg .note { display: block; margin-top: 8px; font-size: 12px; color: #fbbf24; }

    .attach-row { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
    .attach-row:empty { display: none; }
    .attach { display: flex; align-items: center; gap: 6px; background: #1d2433; border: 1px solid #2e374d; border-radius: 8px; padding: 4px 8px; font-size: 12px; }
    .attach img { height: 28px; border-radius: 4px; }
    .attach button { background: transparent; color: #9ca3af; padding: 0 4px; }

    .prompt-bar {
      flex-shrink: 0;
      display: flex; gap: 8px; align-items: center; background: #161a24; border: 1px solid #2a3142;
      border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .btn-attach { background: #1d2433; color: #e5e7eb; padding: 8px 12px; }

    @media (max-width: 760px) {
      .toast { left: 50%; }
      .workspace { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 1px solid #1f2430; max-height: 150px; }
      main { padding: 12px; }
      .msg { max-width: 94%; }
      .scroll-bottom-btn { bottom: 76px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">ZENA <span>AI</span></div>
      <div class="header-center">
        <span id="server-status" class="server-status">서버 확인 중...</span>
        <button id="btn-start-server" class="btn-start" type="button" style="display:none">서버 켜기</button>
        <button id="btn-stop-server" class="btn-stop-server" type="button" style="display:none">서버 끄기</button>
        <button id="btn-view-log" class="btn-log" type="button" style="display:none">로그 보기</button>
      </div>
    </div>

    <div id="guest-nav" class="nav-actions">
      <button id="open-login-btn" class="btn-outline" type="button">로그인</button>
      <button id="open-signup-btn" class="btn-primary" type="button">회원가입</button>
    </div>

    <div id="user-nav" class="nav-actions" style="display:none">
      <span id="user-email" class="user-badge"></span>
      <button id="btn-logout" class="btn-outline" type="button">로그아웃</button>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <button id="btn-new-chat" class="btn-new-chat" type="button">+ 새 채팅</button>
      <div class="history-title">내 채팅 내역</div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <main>
      <div id="chat-box" class="chat-box"></div>
      <button id="scroll-bottom-btn" class="scroll-bottom-btn" type="button" title="맨 아래로 이동" aria-label="맨 아래로 이동">↓</button>
      <div id="attach-row" class="attach-row"></div>
      <form id="prompt-form" class="prompt-bar">
        <div class="plus-wrap">
          <button id="plus-btn" type="button" class="btn-plus" title="추가" aria-label="추가" aria-haspopup="menu" aria-expanded="false">+</button>
          <div id="plus-menu" class="plus-menu" role="menu" hidden>
            <button id="menu-upload" type="button" role="menuitem" class="menu-item"><span class="mi">📎</span><span>파일 업로드</span></button>
            <div class="menu-sep"></div>
            <button id="menu-search" type="button" role="menuitem" class="menu-item" data-mode="auto"><span class="mi">🌐</span><span>웹 검색</span><span id="search-mode-label" class="mi-state">자동</span></button>
          </div>
        </div>
        <span id="search-chip" class="search-chip" hidden></span>
        <input id="file-input" type="file" multiple hidden
               accept="image/*,.txt,.md,.py,.js,.ts,.csv,.json,.log,.html,.css,.xml,.yaml,.yml,.ini,.sh,.java,.c,.cpp,.cs,.sql" />
        <input id="prompt-input" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" />
        <button id="send-btn" type="submit" class="btn-primary">전송</button>
      </form>
    </main>
  </div>

  <div id="log-modal" class="log-modal" role="dialog" aria-modal="true" aria-label="서버 로그" hidden>
    <div class="log-panel">
      <div class="log-head">
        <strong>서버 로그</strong>
        <span id="log-state" class="log-state"></span>
        <button id="log-close" class="btn-outline" type="button">닫기</button>
      </div>
      <pre id="log-body" class="log-body">불러오는 중…</pre>
    </div>
  </div>

  <div id="img-lightbox" class="img-lightbox" role="dialog" aria-modal="true" aria-label="이미지 확대 보기">
    <button id="img-lightbox-close" class="img-lightbox-close" type="button" title="닫기">×</button>
    <div class="img-lightbox-inner">
      <img id="img-lightbox-view" alt="첨부 이미지 확대 보기" />
      <div id="img-lightbox-meta" class="img-lightbox-meta"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://vaavajitxupofylpbkxc.supabase.co',
      'sb_publishable_htUIneIFWtfmMz7khGtDww_yu2Xlhpe'
    );

    // ---- 설정 ----
    const WORKER_URL = 'https://zena-chat-memory.zena-ai.workers.dev';
    const LOGIN_PAGE = 'login/';
    const SIGNUP_PAGE = 'signup/';
    const SYSTEM_MSG = { role: 'system', content: '당신은 정확한 AI 어시스턴트 ZENA AI입니다. 한국어로 답해. 사용자가 요청한 사항은 최대한 이행해 확실하지 않은 사실은 아는 척하지 말고 모른다고 말해.' };
    const CONTINUE_PROMPT = '앞의 답변을 끊긴 부분부터 바로 이어서 작성해 줘. 중복은 피하고 이어서만 써.';
    // 서버(llama-server)의 실제 컨텍스트 길이는 /props 로 읽어서 맞춰요. 못 읽으면 가장 작은 값(4096)을 써요.
    // 한글은 토큰을 많이 쓰기 때문에 글자당 1.2토큰으로 넉넉히(보수적으로) 계산해요.
    const CTX_FALLBACK = 4096;
    const MAX_OUT = 1024;
    const SAFETY_TOKENS = 400;      // 계산 오차 여유분
    const SUMMARIZE_AT = 0.55;      // 입력 예산의 이 비율을 넘으면 앞부분을 요약해서 저장
    const KEEP_TAIL = 2;            // 요약할 때 마지막 한 턴(질문+답)은 그대로 둬요
    const IMG_TOKENS = 700;         // 이미지 1장이 쓰는 토큰 (넉넉히)
    const COMPACT_DELAY_MS = 15000; // 답변 후 이만큼 기다려도 입력이 없을 때만 요약을 시작해요
    let ctxTokens = CTX_FALLBACK;
    const inputBudget = () => Math.max(1000, ctxTokens - MAX_OUT - SAFETY_TOKENS);
    const fileChars = () => Math.floor(inputBudget() * 0.35 / 1.2);
    const totalFileChars = () => Math.floor(inputBudget() * 0.5 / 1.2);
    const MAX_IMAGES = 2;
    const FILE_READ_LIMIT = 300000;   // 큰 파일은 앞부분만 읽어서 브라우저가 멈추지 않게
    // Worker가 Authorization 헤더를 허용/검증하도록 고친 뒤에 true로 바꾸세요 (설명 참고)
    const SEND_JWT = false;
    const AUTO_LOGIN_KEY = 'zena_auto_login';
    const SESSION_ALIVE_KEY = 'zena_session_alive';
    const FROM_AUTH_KEY = 'zena_from_auth';   // 로그인/회원가입 페이지가 남기는 표시
    const MAX_AUTO_CONTINUES = 6;   // 길이 제한/연결 끊김 때 자동으로 이어 쓰는 최대 횟수
    const MAX_NET_RETRIES = 2;      // 첫 글자 전에 네트워크 오류가 나면 다시 시도하는 횟수
    const STALL_MS = 45000;         // 글자가 오다가 이 시간 동안 아무것도 안 오면 끊긴 것으로 보고 이어쓰기
    const STALE_MS = 120000;
    const TITLE_SRC_CHARS = 300;
    const TITLE_MAX_CHARS = 30;
    const TEXT_EXT = /\.(txt|md|py|js|ts|csv|json|log|html|css|xml|yaml|yml|ini|sh|java|c|cpp|cs|sql)$/i;

    const $ = (id) => document.getElementById(id);
    const chatBox = $('chat-box'), historyListEl = $('history-list'), attachRow = $('attach-row');
    const promptInput = $('prompt-input'), sendBtn = $('send-btn'), fileInput = $('file-input');
    const serverStatus = $('server-status'), promptForm = $('prompt-form');
    const startBtn = $('btn-start-server');
    const stopBtn = $('btn-stop-server');
    const logBtn = $('btn-view-log');
    const plusBtn = $('plus-btn');
    const plusMenu = $('plus-menu');
    const scrollBottomBtn = $('scroll-bottom-btn');

    // ---- 상태 ----
    let user = null, allowed = true, accessCheckFailed = false, accessToken = '', accessErrorMsg = '';
    let server = { url: '', api_key: '', online: false };
    let vm = { status: 'UNKNOWN', canStart: false, startedAt: 0, known: false };   // GCP VM 상태
    let compactTimer = null, compactCtl = null;
    // 대화 기억: 앞부분은 요약해서 Cloudflare(D1)에 저장하고, 요약에 포함된 메시지 수(covered)를 같이 기억해요
    let sessionSummary = '', covered = 0, baseOffset = 0;   // baseOffset: 불러온 메시지 앞에 있던 메시지 수
    let compactJob = null, ctxFor = '';
    let searchMode = 'auto';   // auto: AI가 필요할 때만 / on: 항상 / off: 사용 안 함
    try { const m = localStorage.getItem('zena_search_mode'); if (m === 'auto' || m === 'on' || m === 'off') searchMode = m; } catch {}
    let stopUntil = 0;         // 서버 끄기를 누른 뒤, 완전히 꺼질 때까지 '종료 중'으로 고정해요
    let chats = [];
    let activeId = crypto.randomUUID(), messages = [], pending = [];
    let busy = false, ctl = null, userAborted = false;
    let live = null;                 // 지금 답변이 써지는 말풍선 { msg, bubble, txt }
    let lastData = Date.now();       // 마지막으로 서버에서 데이터가 온 시각
    let flushQueued = false;
    let sessionInit = false, sessionSeq = 0;
    const needTitle = new Set([activeId]);

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    function isLoggedIn() {
      return !!(user && user.id);
    }

    function canUseChat() {
      return isLoggedIn() && allowed;
    }

    function authHeaders() {
      return (SEND_JWT && accessToken) ? { Authorization: `Bearer ${accessToken}` } : {};
    }

    function apiHeaders(extra = {}) {
      return {
        'Content-Type': 'application/json',
        'X-User-Id': user?.id || '',
        ...authHeaders(),
        ...extra,
      };
    }

    // ---- 스크롤 ----
    let followBottom = true;

    function distanceFromBottom() {
      return chatBox.scrollHeight - chatBox.clientHeight - chatBox.scrollTop;
    }

    function updateScrollButton() {
      const hasOverflow = chatBox.scrollHeight > chatBox.clientHeight + 24;
      const showBtn = hasOverflow && distanceFromBottom() > 220;
      scrollBottomBtn.classList.toggle('visible', showBtn);
    }

    function syncScrollState() {
      const dist = distanceFromBottom();
      followBottom = dist <= 36;
      updateScrollButton();
    }

    chatBox.addEventListener('scroll', syncScrollState, { passive: true });
    chatBox.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) {
        followBottom = false;
      }
      updateScrollButton();
    }, { passive: true });
    chatBox.addEventListener('touchmove', syncScrollState, { passive: true });

    function scrollChatToBottom(force = false) {
      if (force) {
        followBottom = true;
        chatBox.scrollTop = chatBox.scrollHeight;
        updateScrollButton();
        return;
      }
      if (!followBottom) {
        updateScrollButton();
        return;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
      updateScrollButton();
    }

    scrollBottomBtn.addEventListener('click', () => {
      scrollChatToBottom(true);
    });

    // ---- 답변 화면 갱신 (프레임당 1번으로 묶음) ----
    function flushLive() {
      flushQueued = false;
      if (!live) return;
      renderRich(live.txt, live.msg.text);
      scrollChatToBottom(false);
    }

    function queueFlush() {
      if (flushQueued) return;
      flushQueued = true;
      requestAnimationFrame(flushLive);   // 숨겨진 탭에서는 보류되고, 돌아오면 바로 실행돼요
    }

    // 다른 창에 갔다가 돌아왔을 때
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      lastData = Date.now();              // 돌아온 직후 '멈춤' 오판 방지
      if (live) flushLive();
      else if (followBottom) {
        chatBox.scrollTop = chatBox.scrollHeight;
        updateScrollButton();
      }
      pollServer();
    });

    // 답변 중에 창을 닫거나 새로고침하려 할 때 확인
    window.addEventListener('beforeunload', (e) => {
      if (busy) { e.preventDefault(); e.returnValue = ''; }
    });

    // ---- 상태 표시 ----
    function getUserDisplayLabel(u) {
      if (!u) return '';
      const nick = u.user_metadata?.nickname || u.user_metadata?.display_name || u.user_metadata?.full_name || '';
      return nick ? `${nick} (${u.email})` : (u.email || '');
    }

    function setStatus(text, cls) { serverStatus.textContent = text; serverStatus.className = 'server-status ' + (cls || ''); }

    function vmBooting() {
      return ['PROVISIONING', 'STAGING', 'RUNNING'].includes(vm.status) || (Date.now() - vm.startedAt < 30000);
    }

    function isStopping() { return stopUntil > Date.now(); }

    function updateStartBtn() {
      const show = canUseChat() && !server.online && vm.canStart && vm.status === 'TERMINATED' && !isStopping()
        && (Date.now() - vm.startedAt >= 30000);
      startBtn.style.display = show ? '' : 'none';
      startBtn.disabled = false;
      // 서버가 켜져 있을 때, 켜고 끌 권한이 있는 사용자에게만 '서버 끄기'를 보여줘요
      const showStop = canUseChat() && server.online && vm.canStart && !isStopping();
      stopBtn.style.display = showStop ? '' : 'none';
      stopBtn.disabled = false;
      // 서버를 켜는 중이거나 끄는 중일 때만, 권한이 있는 사용자에게 '로그 보기'를 보여줘요
      // (서버가 이미 온라인이면 VM 상태 값이 오래된 것일 수 있어서, 끄는 중인 경우가 아니면 숨겨요)
      const transitioning = isStopping()
        || (!server.online && (['PROVISIONING', 'STAGING', 'STOPPING', 'SUSPENDING'].includes(vm.status) || vmBooting()));
      logBtn.style.display = (canUseChat() && vm.canStart && transitioning) ? '' : 'none';
    }

    function refreshStatusLabel() {
      updateStartBtn();
      if (!isLoggedIn()) return setStatus('로그인 필요', 'offline');
      if (accessCheckFailed) return setStatus('권한 확인 실패', 'offline');
      if (!allowed) return setStatus('접근 권한 없음', 'offline');
      if (isStopping()) setStatus('서버 종료 중…', 'booting');
      else if (server.online) setStatus('AI 서버 온라인', 'online');
      else if (vmBooting()) setStatus('서버 켜는 중… (약 5분)', 'booting');
      else if (vm.status === 'STOPPING') setStatus('서버 종료 중', 'offline');
      else setStatus('AI 서버 꺼짐', 'offline');
    }

    function updateUi() {
      const loggedIn = isLoggedIn();
      const usable = canUseChat();
      $('guest-nav').style.display = loggedIn ? 'none' : 'flex';
      $('user-nav').style.display = loggedIn ? 'flex' : 'none';
      $('user-email').textContent = getUserDisplayLabel(user);

      promptInput.disabled = !usable || busy;
      promptInput.placeholder = loggedIn ? '메시지를 입력하세요...' : '로그인 후 채팅을 이용할 수 있어요.';
      sendBtn.disabled = !usable;
      plusBtn.disabled = !usable || busy;
      if (plusBtn.disabled) closePlusMenu();
      $('btn-new-chat').disabled = !usable;
      promptForm.classList.toggle('locked', !usable);
      refreshStatusLabel();
    }

    // ---- 서버 주소 ----
    // ---- 서버 로그 보기 (허용된 이메일만) ----
    let logTimer = null, logBusy = false;
    const logModal = $('log-modal'), logBody = $('log-body'), logState = $('log-state');
    async function fetchLogs() {
      if (logBusy || !accessToken) return;
      logBusy = true;
      try {
        const res = await fetch(`${WORKER_URL}/api/vm/logs`, { headers: { Authorization: `Bearer ${accessToken}` } });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) { logBody.textContent = d.error || `로그를 불러오지 못했어요 (${res.status})`; if (res.status === 403) closeLogs(); return; }
        const near = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 60;
        logBody.textContent = d.logs || '(아직 로그가 없어요)';
        if (near) logBody.scrollTop = logBody.scrollHeight;
        logState.textContent = `VM ${d.status} · 3초마다 갱신`;
      } catch (err) {
        logBody.textContent = '로그를 불러오지 못했어요: ' + err.message;
      } finally { logBusy = false; }
    }
    function openLogs() {
      if (!vm.canStart) return;
      logModal.hidden = false;
      logBody.textContent = '불러오는 중…';
      fetchLogs().then(() => { logBody.scrollTop = logBody.scrollHeight; });
      clearInterval(logTimer);
      logTimer = setInterval(() => { if (!document.hidden) fetchLogs(); }, 3000);
    }
    function closeLogs() { logModal.hidden = true; clearInterval(logTimer); logTimer = null; }
    logBtn.addEventListener('click', openLogs);
    $('log-close').addEventListener('click', closeLogs);
    logModal.addEventListener('click', (e) => { if (e.target === logModal) closeLogs(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !logModal.hidden) closeLogs(); });

    async function pollVm() {
      if (!canUseChat() || !accessToken) return;
      try {
        const res = await fetch(`${WORKER_URL}/api/vm/status`, { headers: { Authorization: `Bearer ${accessToken}` } });
        if (!res.ok) { vm.status = 'UNKNOWN'; vm.canStart = false; return; }
        const d = await res.json();
        vm.status = d.status || 'UNKNOWN';
        vm.canStart = !!d.canStart;
        if (vm.status !== 'TERMINATED') vm.startedAt = 0;
        else stopUntil = 0;   // 완전히 꺼졌어요
      } catch {
        vm.status = 'UNKNOWN'; vm.canStart = false;
      } finally {
        vm.known = true;
      }
    }

    // 서버가 꺼져 있을 때는 VM 상태를 계속 확인하고, 켜져 있을 때는 권한 확인을 위해 한 번만 확인해요
    async function pollServer() {
      await pollServerInner();
      if (!canUseChat()) return;
      // 꺼지는 동안 VM이 마지막으로 보내는 '온라인' 신호 때문에 다시 켜진 것처럼 보이지 않게 해요
      if (isStopping()) server = { ...server, online: false };
      if (!server.online || !vm.known || isStopping()) {
        await pollVm();
        refreshStatusLabel();
      }
    }

    async function pollServerInner() {
      if (!canUseChat()) return;
      try {
        const res = await fetch(`${WORKER_URL}/api/server`, { headers: authHeaders() });
        if (res.ok) {
          const d = await res.json();
          const updMs = d.updated_at ? new Date(d.updated_at).getTime() : 0;
          const fresh = !updMs || (Date.now() - updMs < STALE_MS);
          const nextUrl = String(d.url || '').replace(/\/+$/, '');
          if (nextUrl) {
            server = {
              url: nextUrl,
              api_key: d.api_key || '',
              online: !!(d.online && fresh),
            };
            refreshStatusLabel();
            return;
          }
        }
      } catch {}

      try {
        const { data, error } = await supabase.from('server_config')
          .select('url,api_key,online,updated_at').eq('id', 'main').maybeSingle();
        if (error || !data) {
          server = { ...server, online: false };   // 주소는 지우지 않고 오프라인으로만 표시
        } else {
          const fresh = !data.updated_at || (Date.now() - new Date(data.updated_at).getTime() < STALE_MS);
          server = {
            url: String(data.url || '').replace(/\/+$/, '') || server.url,
            api_key: data.api_key || server.api_key,
            online: !!(data.online && data.url && fresh),
          };
        }
      } catch {
        server = { ...server, online: false };
      }
      refreshStatusLabel();
    }
    setInterval(() => { if (!document.hidden) pollServer(); }, 10000);

    // ---- 채팅 목록 / 저장 ----
    async function loadChats() {
      if (!canUseChat()) { chats = []; renderHistory(); return; }
      try {
        const res = await fetch(`${WORKER_URL}/api/sessions`, { headers: apiHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        chats = (data.sessions || []).map((s) => ({
          id: s.session_id,
          title: s.title || s.session_id,
          updated_at: s.updated_at || null,
        }));
      } catch (err) {
        console.error('채팅 목록 로드 실패:', err);
        chats = [];
      }
      renderHistory();
    }

    function renderHistory() {
      historyListEl.innerHTML = '';
      if (!chats.length) {
        const d = document.createElement('div'); d.className = 'history-empty';
        d.textContent = isLoggedIn() ? '저장된 채팅이 없어요.' : '로그인하면 내 채팅 내역을 볼 수 있어요.';
        historyListEl.appendChild(d); return;
      }
      chats.forEach((c) => {
        const item = document.createElement('div');
        item.className = 'history-item' + (c.id === activeId ? ' active' : '');
        item.title = c.title;
        const label = document.createElement('span'); label.className = 'history-label'; label.textContent = c.title;
        const del = document.createElement('button'); del.className = 'btn-del-chat'; del.type = 'button'; del.textContent = '×';
        del.addEventListener('click', (e) => { e.stopPropagation(); deleteChat(c.id); });
        item.addEventListener('click', () => openChat(c.id));
        item.append(label, del); historyListEl.appendChild(item);
      });
    }

    async function openChat(id) {
      if (busy || !canUseChat()) return;
      try {
        const res = await fetch(`${WORKER_URL}/api/continue?session_id=${encodeURIComponent(id)}`, {
          headers: apiHeaders(),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        activeId = id;
        const recent = data.recentMessages || [];
        messages = recent.map(restoreMessage);
        // 저장된 요약과 '요약에 포함된 메시지 수'를 불러와요
        sessionSummary = data.session?.summary || '';
        let st = {};
        try { st = JSON.parse(data.session?.state_json || '{}'); } catch {}
        covered = Number(st.covered) || 0;
        baseOffset = Math.max(0, (Number(data.total) || recent.length) - recent.length);
        pending = [];
        followBottom = true;
        renderPending(); renderHistory(); renderChat(true);
      } catch (err) {
        addBubble('대화 불러오기 실패: ' + err.message, 'err');
      }
    }

    // 저장된 사용자 메시지는 "질문\n\n[첨부 파일: 이름]\n내용..." 형태라서, 화면에는 질문 + 칩으로만 보여줘요
    function restoreMessage(m) {
      const content = m.content || '';
      if (m.role !== 'user') {
        let sources;
        try { const j = m.sources ? JSON.parse(m.sources) : null; if (Array.isArray(j) && j.length) sources = j; } catch {}
        return sources ? { role: 'assistant', text: content, sources } : { role: 'assistant', text: content };
      }
      const idx = content.indexOf('\n\n[첨부 파일: ');
      const imgNote = content.match(/\n*\(이미지 (\d+)장 첨부\)\s*$/);
      if (idx < 0 && !imgNote) return { role: 'user', text: content, ai: content };
      const head = idx >= 0 ? content.slice(0, idx) : content.replace(/\n*\(이미지 \d+장 첨부\)\s*$/, '');
      const files = [...content.matchAll(/\[첨부 파일: ([^\]\n]+)\]/g)].map((x) => x[1]);
      return { role: 'user', text: head, ai: content, files, imgCount: imgNote ? Number(imgNote[1]) : 0 };
    }

    function newChat() {
      if (busy || !canUseChat()) return;
      activeId = crypto.randomUUID(); messages = []; pending = [];
      sessionSummary = ''; covered = 0; baseOffset = 0;
      needTitle.add(activeId);
      followBottom = true;
      renderPending(); renderHistory(); renderChat(true); promptInput.focus();
    }

    async function deleteChat(id) {
      if (busy || !canUseChat()) return;
      try {
        await fetch(`${WORKER_URL}/api/session?session_id=${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: apiHeaders(),
        });
      } catch (err) {
        addBubble('대화 삭제 실패: ' + err.message, 'err');
      }
      chats = chats.filter((c) => c.id !== id);
      needTitle.delete(id);
      if (activeId === id) newChat(); else renderHistory();
    }

    async function saveChat(userText, assistantText, sources) {
      if (!canUseChat()) return false;
      const existing = chats.find((c) => c.id === activeId);
      const title = existing?.title || (userText || '새 채팅').slice(0, 26);
      const res = await fetch(`${WORKER_URL}/api/turn`, {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          session_id: activeId,
          title,
          user_text: userText,
          assistant_text: assistantText,
          sources: Array.isArray(sources) && sources.length ? sources.map((x) => ({ title: x.title, url: x.url })) : undefined,
        }),
      });
      if (!res.ok) {
        addBubble(`대화 저장 실패 (${res.status})`, 'err');
        return false;
      }
      const nowIso = new Date().toISOString();
      const i = chats.findIndex((c) => c.id === activeId);
      if (i >= 0) chats.splice(i, 1);
      chats.unshift({ id: activeId, title, updated_at: nowIso });
      renderHistory();
      return true;
    }

    async function generateTitle(id, userText, aiText, url, key) {
      if (!url || !canUseChat()) return;
      const ctl2 = new AbortController();
      const timer = setTimeout(() => ctl2.abort(), 90000);
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (key) headers['Authorization'] = `Bearer ${key}`;
        const prompt =
          '아래 대화의 주제를 2~6단어의 짧은 한국어 제목으로 만들어줘. ' +
          '제목만 한 줄로 출력하고, 따옴표·마침표·설명은 쓰지 마.\n\n' +
          `사용자: ${userText.slice(0, TITLE_SRC_CHARS)}\nAI: ${aiText.slice(0, TITLE_SRC_CHARS)}`;
        const res = await fetch(`${url}/v1/chat/completions`, {
          method: 'POST', headers, signal: ctl2.signal,
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }],
            stream: false, max_tokens: 24, temperature: 0.3,
          }),
        });
        if (!res.ok) return;
        const data = await res.json();
        let title = (data?.choices?.[0]?.message?.content || '')
          .split('\n').map((s) => s.trim()).find(Boolean) || '';
        title = title
          .replace(/^제목\s*[:：]\s*/, '')
          .replace(/^[#*"'“”‘’`\s]+/, '')
          .replace(/[#*"'“”‘’`.。\s]+$/, '')
          .slice(0, TITLE_MAX_CHARS);
        if (!title) return;
        const entry = chats.find((c) => c.id === id);
        if (!entry) return;
        entry.title = title;
        renderHistory();
        await fetch(`${WORKER_URL}/api/turn`, {
          method: 'POST',
          headers: apiHeaders(),
          body: JSON.stringify({ session_id: id, title, user_text: '', assistant_text: '' }),
        });
      } catch {}
      finally { clearTimeout(timer); }
    }

    // ---- 이미지 확대 ----
    const lightboxEl = $('img-lightbox');
    const lightboxImgEl = $('img-lightbox-view');
    const lightboxMetaEl = $('img-lightbox-meta');
    const lightboxCloseBtn = $('img-lightbox-close');

    function openLightbox(src, name = '') {
      if (!src) return;
      lightboxImgEl.src = src;
      lightboxMetaEl.textContent = name ? `${name} · 클릭하거나 ESC로 닫기` : '클릭하거나 ESC로 닫기';
      lightboxEl.classList.add('open');
    }

    function closeLightbox() {
      lightboxEl.classList.remove('open');
      lightboxImgEl.src = '';
    }

    lightboxCloseBtn.addEventListener('click', closeLightbox);
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxEl.classList.contains('open')) closeLightbox();
    });

    // ---- 렌더링 ----
    // ---- 코드 블록(복사 버튼 포함) / 인라인 코드 ----
    function splitBlocks(text) {
      const segs = [];
      let buf = [], code = null;
      const flushText = () => {
        const t = buf.join('\n').replace(/^\n+|\n+$/g, '');
        if (t) segs.push({ type: 'text', text: t });
        buf = [];
      };
      for (const line of String(text).split('\n')) {
        const m = line.match(/^\s*```(.*)$/);
        if (code === null) {
          if (m) { flushText(); code = { type: 'code', lang: m[1].trim().split(/\s+/)[0] || '', lines: [] }; }
          else buf.push(line);
        } else if (m && m[1].trim() === '') {
          code.code = code.lines.join('\n'); segs.push(code); code = null;     // 닫는 ```
        } else {
          code.lines.push(line);
        }
      }
      if (code) { code.code = code.lines.join('\n'); segs.push(code); }        // 아직 안 닫힌(쓰는 중인) 코드 블록
      flushText();
      return segs;
    }

    function appendInline(parent, text) {
      for (const part of String(text).split(/(`[^`\n]+`)/g)) {
        if (!part) continue;
        if (part.length > 2 && part.startsWith('`') && part.endsWith('`')) {
          const c = document.createElement('code');
          c.className = 'inline-code';
          c.textContent = part.slice(1, -1);
          parent.appendChild(c);
        } else {
          parent.appendChild(document.createTextNode(part));
        }
      }
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch {}
      try {   // 클립보드 API를 못 쓰는 환경용 대체 방법
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }

    function buildCodeBlock(seg) {
      const box = document.createElement('div'); box.className = 'codeblock';
      const head = document.createElement('div'); head.className = 'codeblock-head';
      const lang = document.createElement('span'); lang.textContent = seg.lang || '코드';
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'copy-btn'; btn.textContent = '복사';
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await copyText(seg.code);
        btn.textContent = ok ? '복사됨 ✓' : '복사 실패';
        setTimeout(() => { btn.textContent = '복사'; }, 1500);
      });
      head.append(lang, btn);
      const pre = document.createElement('pre');
      const code = document.createElement('code'); code.textContent = seg.code;
      pre.appendChild(code);
      box.append(head, pre);
      return box;
    }

    function renderRich(el, text) {
      const t = String(text || '');
      if (el._rich === t) return;          // 바뀐 게 없으면 다시 그리지 않아요
      el._rich = t;
      el.textContent = '';
      for (const seg of splitBlocks(t)) {
        if (seg.type === 'code') el.appendChild(buildCodeBlock(seg));
        else appendInline(el, seg.text);
      }
    }

    function buildBubble(m) {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      const t = document.createElement('span'); t.className = 'txt'; renderRich(t, m.text || ''); div.appendChild(t);
      (m.files || []).forEach((n) => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = '📄 ' + n; div.appendChild(c); });
      if (m.imgCount && !(m.images && m.images.length) && !(m.thumbs && m.thumbs.length)) {
        const c = document.createElement('span'); c.className = 'chip'; c.textContent = `🖼 이미지 ${m.imgCount}장`; div.appendChild(c);
      }
      const previewSources = (m.images && m.images.length) ? m.images : (m.thumbs || []);
      previewSources.forEach((src, idx) => {
        const im = document.createElement('img');
        const thumbSrc = (m.thumbs && m.thumbs[idx]) ? m.thumbs[idx] : src;
        im.src = thumbSrc;
        im.alt = `첨부 이미지 ${idx + 1}`;
        im.title = '클릭해서 크게 보기';
        im.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(src, `이미지 ${idx + 1}`);
        });
        div.appendChild(im);
      });
      if (m.sources?.length) renderSources(div, m.sources);
      return div;
    }

    function renderSources(bubble, sources) {
      if (!sources?.length) return;
      const box = document.createElement('div'); box.className = 'sources';
      const t = document.createElement('div'); t.className = 'sources-title'; t.textContent = '🔎 출처';
      box.appendChild(t);
      sources.forEach((src, i) => {
        if (!/^https?:\/\//i.test(src.url || '')) return;
        const a = document.createElement('a');
        a.href = src.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = `[${i + 1}] ${src.title || src.url}`;
        box.appendChild(a);
      });
      bubble.appendChild(box);
    }

    function addBubble(text, cls) {
      const div = document.createElement('div'); div.className = 'msg ' + cls; div.textContent = text;
      chatBox.appendChild(div);

    function setHint(lines) {
      const h = document.createElement('div'); h.className = 'hint';
      lines.forEach((l, i) => {
        if (i) h.appendChild(document.createElement('br'));

    function renderLoginGate() {
      const gate = document.createElement('div');
      gate.className = 'login-gate';

      const title = document.createElement('h2');
      title.textContent = '로그인이 필요한 서비스예요';

    function renderChat(forceScroll = false) {
      chatBox.innerHTML = '';
      if (!isLoggedIn()) {
        renderLoginGate();
        updateScrollButton();

      }
      if (accessCheckFailed) {
        setHint(['권한을 확인하지 못했어요.', '오류: ' + (accessErrorMsg || '알 수 없음'), '새로고침해도 같으면 이 오류 문구를 알려 주세요.']);
        updateScrollButton();
        return;
      }
      if (!allowed) {
        setHint(['이 계정은 아직 사용 권한이 없어요.', { bold: user.email }, '관리자가 허용 목록에 이 이메일을 추가하면 사용할 수 있어요.', '다른 계정으로 쓰려면 로그아웃해 주세요.']);

        return;
