<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <title>ZENA AI - 회원가입</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; color: #f3f4f6; display: flex; flex-direction: column; min-height: 100dvh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 20px; border-bottom: 1px solid #1f2430; background: #131620;
    }
    .logo { font-size: 20px; font-weight: 700; color: #f3f4f6; text-decoration: none; cursor: pointer; }
    .logo span { color: #60a5fa; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-back {
      color: #9ca3af; font-size: 13px; text-decoration: none; padding: 6px 12px;
      border: 1px solid #2e374d; border-radius: 8px; transition: background .15s, color .15s;
    }
    .btn-back:hover { color: #fff; background: #1f2937; }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: #161a24; border: 1px solid #232938;
      border-radius: 16px; padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .desc { margin: 0 0 18px; font-size: 13px; color: #9ca3af; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid #2e374d; background: #0f1117; color: #fff; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #3b82f6; }
    input.invalid { border-color: #f87171; }
    input.otp-input {
      font-size: 20px; letter-spacing: 8px; text-align: center; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .field-hint {
      margin: -8px 0 10px; font-size: 12px; color: #9ca3af; min-height: 16px;
    }
    .field-hint.err { color: #f87171; font-weight: 500; }
    .field-hint.ok { color: #4ade80; }

    /* 캡차 영역 */
    .captcha-box {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    #captcha-canvas {
      border-radius: 10px; border: 1px solid #2e374d; background: #0b0d13;
      flex-shrink: 0; display: block;
    }
    .btn-refresh {
      width: auto; padding: 10px 12px; border-radius: 10px;
      background: #1d2433; color: #e5e7eb; border: 1px solid #2e374d;
      font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }
    .btn-refresh:hover:not(:disabled) { background: #263044; }

    button {
      width: 100%; cursor: pointer; border: none; border-radius: 10px; padding: 11px 14px;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .15s, transform .05s, opacity .15s;
    }
    button:active:not(:disabled) { transform: scale(0.99); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    button[type="submit"] {
      margin-top: 4px;
      background: #3b82f6; color: #fff;
    }
    button[type="submit"]:hover:not(:disabled) { background: #2563eb; }

    .otp-actions {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .btn-secondary {
      background: #1d2433; color: #e5e7eb; border: 1px solid #2e374d;
    }
    .btn-secondary:hover:not(:disabled) { background: #263044; }

    .divider {
      display: flex; align-items: center; gap: 10px; margin: 16px 0;
      color: #6b7280; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: #262d3d;
    }
    .social-list { display: flex; flex-direction: column; gap: 10px; }

    /* Google 공식 브랜드 스타일 */
    .btn-google {
      background: #ffffff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
    }
    .btn-google:hover:not(:disabled) {
      background: #f8f9fa;
    }

    /* Apple 공식 브랜드 스타일 */
    .btn-apple {
      background: #000000;
      color: #ffffff;
      border: 1px solid #333333;
    }
    .btn-apple:hover:not(:disabled) {
      background: #141414;
      border-color: #4b5563;
    }

    .brand-icon {
      width: 18px; height: 18px; flex-shrink: 0; display: block;
    }

    .footer-link {
      margin-top: 14px; text-align: center; font-size: 13px; color: #9ca3af;
    }
    .footer-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }

    #msg {
      margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
      font-size: 13px; min-height: 18px; color: #f87171; white-space: pre-line;
      background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.35);
      display: none;
    }
    #msg.show { display: block; }
    #msg.ok {
      color: #4ade80; background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.35);
    }
    #msg.info {
      color: #d1d5db; background: rgba(156, 163, 175, 0.12); border-color: rgba(156, 163, 175, 0.25);
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="..">ZENA <span>AI</span></a>
    <div class="header-actions">
      <a class="btn-back" href="../login/">로그인</a>
      <a class="btn-back" href="..">← AI 대화창</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>회원가입</h1>
      <p id="step-desc" class="desc">ZENA AI 새 계정을 만들어 보세요.</p>

      <form id="signup-form" novalidate>
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" maxlength="20" placeholder="2~20자 닉네임 입력" required />

        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required />
        <div id="email-hint" class="field-hint"></div>

        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="8자 이상 입력" required />

        <label for="password-confirm">비밀번호 확인</label>
        <input id="password-confirm" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력" required />
        <div id="pw-hint" class="field-hint"></div>

        <label for="captcha-input">보안 문자 (캡차)</label>
        <div class="captcha-box">
          <canvas id="captcha-canvas" width="180" height="46" aria-label="보안 문자 이미지"></canvas>
          <button id="btn-refresh-captcha" class="btn-refresh" type="button" title="보안 문자 새로고침">↻ 새로고침</button>
        </div>
        <input id="captcha-input" type="text" autocomplete="off" maxlength="6" placeholder="위 이미지의 문자를 입력하세요" required />

        <button id="btn-signup" type="submit">가입하기</button>
      </form>

      <form id="otp-form" style="display:none" novalidate>
        <label for="otp-code">이메일 6자리 인증 코드</label>
        <input
          id="otp-code"
          class="otp-input"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          required
        />

        <button id="btn-verify-otp" type="submit">인증 완료</button>

        <div class="otp-actions">
          <button id="btn-resend-otp" class="btn-secondary" type="button">코드 재발송</button>
          <button id="btn-edit-info" class="btn-secondary" type="button">정보 수정</button>
        </div>
      </form>

      <div id="social-section">
        <div class="divider">또는 소셜 계정으로 회원가입</div>

        <div class="social-list">
          <button id="btn-google-signup" class="btn-google" type="button">
            <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            <span>Google로 회원가입</span>
          </button>

          <button id="btn-apple-signup" class="btn-apple" type="button">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            <span>Apple로 회원가입 (추후 지원예정)</span>
          </button>
        </div>
      </div>

      <div class="footer-link">
        이미 계정이 있으신가요? <a href="../login">로그인하기</a>
      </div>

      <p id="msg" class="info"></p>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://vaavajitxupofylpbkxc.supabase.co',
      'sb_publishable_htUIneIFWtfmMz7khGtDww_yu2Xlhpe'
    );

    const MAIN_PAGE = '..';
    const LOGIN_PAGE = '../login/';
    const AUTO_LOGIN_KEY = 'zena_auto_login';
    const $ = (id) => document.getElementById(id);

    const stepDescEl = $('step-desc');
    const signupForm = $('signup-form');
    const otpForm = $('otp-form');
    const socialSection = $('social-section');

    const nickEl = $('nickname');
    const emailEl = $('email');
    const emailHintEl = $('email-hint');
    const pwEl = $('password');
    const pwConfirmEl = $('password-confirm');
    const pwHintEl = $('pw-hint');
    const captchaCanvas = $('captcha-canvas');
    const captchaInputEl = $('captcha-input');
    const refreshBtn = $('btn-refresh-captcha');
    const signupBtn = $('btn-signup');

    const otpCodeEl = $('otp-code');
    const verifyOtpBtn = $('btn-verify-otp');
    const resendOtpBtn = $('btn-resend-otp');
    const editInfoBtn = $('btn-edit-info');

    const googleSignupBtn = $('btn-google-signup');
    const appleSignupBtn = $('btn-apple-signup');
    const msgEl = $('msg');

    let captchaCode = '';
    let pendingEmail = '';

    function formatAuthError(rawMessage = '') {
      const msg = String(rawMessage || '').trim();
      if (!msg) return '알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';

      const secMatch = msg.match(/after\s+(\d+)\s+seconds?/i);
      if (secMatch) {
        return `보안상 이유로 ${secMatch[1]}초 후에 다시 요청해 주세요.`;
      }
      const minMatch = msg.match(/after\s+(\d+)\s+minutes?/i);
      if (minMatch) {
        return `보안상 이유로 ${minMatch[1]}분 후에 다시 요청해 주세요.`;
      }
      if (/for security purposes, you can only request this|rate limit|too many requests|over_email_send_rate_limit/i.test(msg)) {
        return '요청 횟수 제한으로 잠시 후 다시 시도해 주세요.';
      }
      if (/new password should be different from the old password/i.test(msg)) {
        return '새 비밀번호는 기존 비밀번호와 다르게 입력해 주세요.';
      }
      if (/password should be at least|password is too short/i.test(msg)) {
        return '비밀번호는 8자 이상 입력해 주세요.';
      }
      if (/weak password|password is known to be weak|easy to guess/i.test(msg)) {
        return '보안에 취약한 비밀번호입니다. 다른 조합으로 입력해 주세요.';
      }
      if (/token has expired|otp expired|expired/i.test(msg)) {
        return '인증 코드가 만료되었습니다. 코드를 다시 발송해 주세요.';
      }
      if (/invalid otp|token is invalid|otp_disabled/i.test(msg)) {
        return '인증 코드가 올바르지 않습니다. 다시 확인해 주세요.';
      }
      if (/user already registered|already been registered|email address is already/i.test(msg)) {
        return '이미 가입된 이메일입니다. 로그인해 주세요.';
      }
      if (/signup is disabled/i.test(msg)) {
        return '현재 신규 회원가입이 제한되어 있습니다.';
      }
      if (/auth session missing|session not found|jwt expired/i.test(msg)) {
        return '인증 세션이 만료되었습니다. 처음부터 다시 진행해 주세요.';
      }
      if (/failed to fetch|networkerror|network request failed/i.test(msg)) {
        return '네트워크 연결을 확인한 뒤 다시 시도해 주세요.';
      }
      return msg;
    }

    function getMainRedirectUrl() {
      const url = new URL(location.href);
      const dir = url.pathname.endsWith('/')
        ? url.pathname
        : url.pathname.replace(/[^/]*$/, '');
      return `${url.origin}${dir}${MAIN_PAGE}`;
    }

    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      const arr = new Uint32Array(6);
      crypto.getRandomValues(arr);
      for (let i = 0; i < 6; i++) {
        code += chars[arr[i] % chars.length];
      }
      captchaCode = code;

      const ctx = captchaCanvas.getContext('2d');
      const w = captchaCanvas.width;
      const h = captchaCanvas.height;

      ctx.fillStyle = '#0b0d13';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = `rgba(96, 165, 250, ${0.2 + Math.random() * 0.25})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(Math.random() * w, Math.random() * h);
        ctx.lineTo(Math.random() * w, Math.random() * h);
        ctx.stroke();
      }

      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = `rgba(156, 163, 175, ${0.25 + Math.random() * 0.35})`;
        ctx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }

      const colors = ['#f3f4f6', '#93c5fd', '#60a5fa', '#e5e7eb'];
      for (let i = 0; i < code.length; i++) {
        const x = 18 + i * 25;
        const y = 30 + (Math.random() * 6 - 3);
        const angle = (Math.random() - 0.5) * 0.38;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillText(code[i], 0, 0);
        ctx.restore();
      }
    }

    function clearEmailHint() {
      emailHintEl.textContent = '';
      emailHintEl.className = 'field-hint';
      emailEl.classList.remove('invalid');
    }

    function setEmailDuplicateHint(text) {
      emailHintEl.textContent = text;
      emailHintEl.className = 'field-hint err';
      emailEl.classList.add('invalid');
    }

    function checkPasswordMatch() {
      const pw = pwEl.value;
      const confirm = pwConfirmEl.value;
      if (!confirm) {
        pwHintEl.textContent = '';
        pwHintEl.className = 'field-hint';
        pwConfirmEl.classList.remove('invalid');
        return false;
      }
      if (pw === confirm) {
        pwHintEl.textContent = '비밀번호가 일치합니다.';
        pwHintEl.className = 'field-hint ok';
        pwConfirmEl.classList.remove('invalid');
        return true;
      } else {
        pwHintEl.textContent = '비밀번호가 일치하지 않습니다.';
        pwHintEl.className = 'field-hint err';
        pwConfirmEl.classList.add('invalid');
        return false;
      }
    }

    function setMsg(text, type = 'info') {
      if (!text) {
        msgEl.textContent = '';
        msgEl.className = 'info';
        return;
      }
      msgEl.textContent = text;
      msgEl.className = `${type} show`;
    }

    function setLoading(v) {
      signupBtn.disabled = v;
      googleSignupBtn.disabled = v;
      appleSignupBtn.disabled = v;
      refreshBtn.disabled = v;
      nickEl.disabled = v;
      emailEl.disabled = v;
      pwEl.disabled = v;
      pwConfirmEl.disabled = v;
      captchaInputEl.disabled = v;

      otpCodeEl.disabled = v;
      verifyOtpBtn.disabled = v;
      resendOtpBtn.disabled = v;
      editInfoBtn.disabled = v;
    }

    function enterOtpStep(targetEmail) {
      pendingEmail = targetEmail;
      signupForm.style.display = 'none';
      socialSection.style.display = 'none';
      otpForm.style.display = 'block';
      stepDescEl.textContent = `${targetEmail} 로 발송된 6자리 인증 코드를 입력해 주세요.`;
      otpCodeEl.value = '';
      otpCodeEl.focus();
    }

    function backToSignupStep() {
      otpForm.style.display = 'none';
      signupForm.style.display = 'block';
      socialSection.style.display = 'block';
      stepDescEl.textContent = 'ZENA AI 새 계정을 만들어 보세요.';
      generateCaptcha();
      captchaInputEl.value = '';
    }

    async function isDuplicateEmail(targetEmail) {
      const { data, error } = await supabase.rpc('is_email_registered', {
        target_email: targetEmail,
      });
      if (error) {
        throw new Error('이메일 중복 확인 중 오류가 발생했습니다: ' + formatAuthError(error.message));
      }
      return data === true;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      location.replace(MAIN_PAGE);
    }

    generateCaptcha();
    refreshBtn.addEventListener('click', () => {
      generateCaptcha();
      captchaInputEl.value = '';
      captchaInputEl.focus();
    });

    emailEl.addEventListener('input', clearEmailHint);
    pwEl.addEventListener('input', checkPasswordMatch);
    pwConfirmEl.addEventListener('input', checkPasswordMatch);

    otpCodeEl.addEventListener('input', () => {
      otpCodeEl.value = otpCodeEl.value.replace(/\D/g, '').slice(0, 6);
    });

    editInfoBtn.addEventListener('click', () => {
      setMsg('', 'info');
      backToSignupStep();
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearEmailHint();
      setMsg('', 'info');

      const nickname = nickEl.value.trim();
      const email = emailEl.value.trim();
      const password = pwEl.value;
      const passwordConfirm = pwConfirmEl.value;
      const captchaInput = captchaInputEl.value.trim().toUpperCase();

      if (nickname.length < 2 || nickname.length > 20) {
        setMsg('닉네임은 2~20자 사이로 입력해 주세요.', 'err');
        nickEl.focus();
        return;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setEmailDuplicateHint('올바른 이메일 주소를 입력해 주세요.');
        setMsg('올바른 이메일 주소를 입력해 주세요.', 'err');
        emailEl.focus();
        return;
      }
      if (password.length < 8) {
        setMsg('비밀번호는 8자 이상 입력해 주세요.', 'err');
        pwEl.focus();
        return;
      }
      if (password !== passwordConfirm) {
        checkPasswordMatch();
        setMsg('비밀번호와 비밀번호 확인이 일치하지 않습니다.', 'err');
        pwConfirmEl.focus();
        return;
      }
      if (!captchaInput || captchaInput !== captchaCode) {
        setMsg('보안 문자가 일치하지 않습니다. 다시 입력해 주세요.', 'err');
        generateCaptcha();
        captchaInputEl.value = '';
        captchaInputEl.focus();
        return;
      }

      setLoading(true);
      setMsg('이메일 사용 여부를 확인하는 중...', 'info');
      try {
        const exists = await isDuplicateEmail(email);
        if (exists) {
          const dupMsg = '이미 가입된 이메일입니다. 로그인해 주세요.';
          setEmailDuplicateHint(dupMsg);
          setMsg(dupMsg, 'err');
          generateCaptcha();
          captchaInputEl.value = '';
          emailEl.focus();
          setLoading(false);
          return;
        }

        setMsg('인증 코드를 발송하는 중...', 'info');
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              nickname,
              display_name: nickname,
            },
          },
        });

        if (error) {
          setMsg('회원가입 실패: ' + formatAuthError(error.message), 'err');
          generateCaptcha();
          captchaInputEl.value = '';
          setLoading(false);
          return;
        }

        localStorage.setItem(AUTO_LOGIN_KEY, '1');

        if (data?.session && data?.user?.email_confirmed_at) {
          setMsg('회원가입 및 로그인 완료! 이동 중...', 'ok');
          location.replace(MAIN_PAGE);
          return;
        }

        setLoading(false);
        enterOtpStep(email);
        setMsg('이메일로 6자리 인증 코드를 발송했습니다. 메일함을 확인해 주세요.', 'ok');
      } catch (err) {
        setMsg('요청 오류: ' + formatAuthError(err.message), 'err');
        generateCaptcha();
        captchaInputEl.value = '';
        setLoading(false);
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = otpCodeEl.value.trim();
      if (!/^\d{6}$/.test(token)) {
        setMsg('6자리 숫자 인증 코드를 입력해 주세요.', 'err');
        otpCodeEl.focus();
        return;
      }

      setLoading(true);
      setMsg('인증 코드를 확인하는 중...', 'info');
      try {
        const { data, error } = await supabase.auth.verifyOtp({
          email: pendingEmail,
          token,
          type: 'signup',
        });

        if (error) {
          setMsg('인증 실패: ' + formatAuthError(error.message), 'err');
          setLoading(false);
          return;
        }

        if (data?.session) {
          setMsg('이메일 인증 완료! 이동 중...', 'ok');
          setTimeout(() => {
            location.replace(MAIN_PAGE);
          }, 900);
        } else {
          setMsg('이메일 인증이 완료되었습니다! 로그인해 주세요.', 'ok');
          setTimeout(() => {
            location.href = LOGIN_PAGE;
          }, 1500);
        }
      } catch (err) {
        setMsg('인증 요청 오류: ' + formatAuthError(err.message), 'err');
        setLoading(false);
      }
    });

    resendOtpBtn.addEventListener('click', async () => {
      if (!pendingEmail) return;
      setLoading(true);
      setMsg('인증 코드를 다시 발송하는 중...', 'info');
      try {
        const { error } = await supabase.auth.resend({
          type: 'signup',
          email: pendingEmail,
        });
        if (error) {
          setMsg('재발송 실패: ' + formatAuthError(error.message), 'err');
        } else {
          setMsg('인증 코드를 다시 보냈습니다. 메일함을 확인해 주세요.', 'ok');
        }
      } catch (err) {
        setMsg('재발송 오류: ' + formatAuthError(err.message), 'err');
      } finally {
        setLoading(false);
      }
    });

    async function signUpWithProvider(provider, label) {
      setLoading(true);
      setMsg(`${label} 계정으로 회원가입 진행 중...`, 'info');
      localStorage.setItem(AUTO_LOGIN_KEY, '1');
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider,
          options: {
            redirectTo: getMainRedirectUrl(),
          },
        });
        if (error) {
          setMsg(`${label} 회원가입 오류: ${formatAuthError(error.message)}`, 'err');
          setLoading(false);
        }
      } catch (err) {
        setMsg(`${label} 회원가입 요청 실패: ${formatAuthError(err.message)}`, 'err');
        setLoading(false);
      }
    }

    googleSignupBtn.addEventListener('click', () => signUpWithProvider('google', 'Google'));
    appleSignupBtn.addEventListener('click', () => signUpWithProvider('apple', 'Apple'));
  </script>
</body>
</html>
